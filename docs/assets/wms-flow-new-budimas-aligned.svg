  <text x="730" y="592" class="label">Shipping</text>
  <text x="702" y="630" class="body">Barang</text>
  <text x="702" y="654" class="body">dikirim</text>

  <path d="M270 440 H302" stroke="#0B5ED7" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M454 440 H486" stroke="#0B5ED7" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M638 440 H670" stroke="#0B5ED7" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M822 440 H854" stroke="#0B5ED7" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M936 498 C936 545 402 516 382 548" stroke="#16A34A" stroke-width="5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M454 616 H486" stroke="#0B5ED7" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M638 616 H670" stroke="#0B5ED7" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1040" y="372" width="128" height="220" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1066" y="412" class="tiny">RAK 3D</text>
  <rect x="1072" y="442" width="22" height="82" rx="5" fill="#0B5ED7" opacity="0.72"/>
  <rect x="1100" y="428" width="22" height="110" rx="5" fill="#16A34A" opacity="0.72"/>
  <rect x="1128" y="458" width="22" height="66" rx="5" fill="#D97706" opacity="0.72"/>
  <text x="1066" y="560" class="body">Visual rak, isi,</text>
  <text x="1066" y="584" class="body">status, lokasi</text>

  <rect x="88" y="746" width="1130" height="324" class="panel"/>
  <text x="128" y="802" class="section">Modul Monitoring Web new_budimas</text>
  <text x="128" y="834" class="body">Tab dan route WMS di web yang menjadi acuan proses Android.</text>

