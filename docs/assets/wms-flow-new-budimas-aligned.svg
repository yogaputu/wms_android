    <rect x="318" y="970" width="168" height="74" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="340" y="1002" class="label">Transaksi</text><text x="340" y="1026" class="body">Riwayat WMS</text>
    <rect x="508" y="970" width="168" height="74" rx="16" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
    <text x="530" y="1002" class="label">Alert</text><text x="530" y="1026" class="body">Low stock</text>
    <rect x="698" y="970" width="168" height="74" rx="16" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="2"/>
    <text x="720" y="1002" class="label">Master Rak</text><text x="720" y="1026" class="body">Tipe dan status</text>
    <rect x="888" y="970" width="168" height="74" rx="16" fill="#ECFDF5" stroke="#BBF7D0" stroke-width="2"/>
    <text x="910" y="1002" class="label">Penempatan</text><text x="910" y="1026" class="body">Isi rak manual</text>
  </g>

  <rect x="1276" y="244" width="424" height="826" rx="46" fill="url(#phone)" filter="url(#shadow)"/>
  <rect x="1306" y="292" width="364" height="720" rx="28" fill="#F8FAFC"/>
  <rect x="1426" y="268" width="124" height="12" rx="6" fill="#344663"/>
  <text x="1334" y="352" class="label">WMS Android</text>
  <text x="1334" y="380" class="body">Mode mobile operator gudang</text>

  <rect x="1334" y="414" width="308" height="78" rx="18" fill="#EAF2FF" stroke="#B7D4FF"/>
  <text x="1356" y="448" class="phoneText">API aktif</text>
  <text x="1356" y="474" class="phoneSub">Membaca endpoint yang sama dengan web</text>

  <rect x="1334" y="524" width="142" height="86" rx="18" fill="#ECFDF5" stroke="#BBF7D0"/>
  <text x="1356" y="558" class="phoneText">Incoming</text><text x="1356" y="584" class="phoneSub">Nota dan QR</text>
  <rect x="1500" y="524" width="142" height="86" rx="18" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="1522" y="558" class="phoneText">Transfer</text><text x="1522" y="584" class="phoneSub">Titipan ke tetap</text>
  <rect x="1334" y="632" width="142" height="86" rx="18" fill="#FFF1F2" stroke="#FECDD3"/>
  <text x="1356" y="666" class="phoneText">Picking</text><text x="1356" y="692" class="phoneSub">Scan rak tetap</text>
  <rect x="1500" y="632" width="142" height="86" rx="18" fill="#EFF6FF" stroke="#B7D4FF"/>
  <text x="1522" y="666" class="phoneText">Loading</text><text x="1522" y="692" class="phoneSub">Manifest</text>
  <rect x="1334" y="740" width="142" height="86" rx="18" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="1356" y="774" class="phoneText">Dropping</text><text x="1356" y="800" class="phoneSub">Karantina</text>
  <rect x="1500" y="740" width="142" height="86" rx="18" fill="#ECFEFF" stroke="#A5F3FC"/>
  <text x="1522" y="774" class="phoneText">Rak</text><text x="1522" y="800" class="phoneSub">Master DB</text>
  <rect x="1334" y="848" width="142" height="86" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="1356" y="882" class="phoneText">Inventory</text><text x="1356" y="908" class="phoneSub">Stok lokasi</text>
  <rect x="1500" y="848" width="142" height="86" rx="18" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="1522" y="882" class="phoneText">History</text><text x="1522" y="908" class="phoneSub">Transaksi</text>

  <rect x="126" y="1100" width="1548" height="54" rx="20" fill="#102A56"/>
  <text x="156" y="1134" class="whiteSmall">Catatan: Android adalah mobile scanner/operator. Web new_budimas menjadi monitoring dan master data: rak, penempatan, alert, transaksi, dan visual Rak 3D.</text>
</svg>
