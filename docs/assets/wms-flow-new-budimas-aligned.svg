  <text x="362" y="416" class="label">QR Palet</text>
  <text x="334" y="454" class="body">Cetak QR</text>
  <text x="334" y="478" class="body">pallet</text>

  <rect x="496" y="382" width="142" height="116" rx="18" fill="#ECFDF5" stroke="#BBF7D0" stroke-width="2" filter="url(#soft)"/>
