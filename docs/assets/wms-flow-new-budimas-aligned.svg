<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="46%" stop-color="#EEF6FF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B5ED7"/>
      <stop offset="52%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132E5D"/>
      <stop offset="100%" stop-color="#071426"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 z" fill="#0B5ED7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="16" markerHeight="16" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <style>
      .title { font: 800 50px Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .subtitle { font: 400 23px Arial, sans-serif; fill: #EAF5FF; }
      .section { font: 800 25px Arial, sans-serif; fill: #102A56; }
      .label { font: 800 21px Arial, sans-serif; fill: #0F172A; }
      .body { font: 400 16px Arial, sans-serif; fill: #475569; }
      .tiny { font: 700 13px Arial, sans-serif; fill: #64748B; }
      .whiteSmall { font: 400 16px Arial, sans-serif; fill: #DBEAFE; }
      .whiteBold { font: 800 21px Arial, sans-serif; fill: #FFFFFF; }
      .card { fill: #FFFFFF; stroke: #D8E3F0; stroke-width: 2; rx: 18; filter: url(#soft); }
      .panel { fill: #FFFFFF; stroke: #D8E3F0; stroke-width: 2; rx: 26; filter: url(#shadow); }
      .numText { font: 800 15px Arial, sans-serif; fill: #FFFFFF; }
      .phoneText { font: 800 15px Arial, sans-serif; fill: #102A56; }
      .phoneSub { font: 400 12px Arial, sans-serif; fill: #64748B; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>

  <rect x="70" y="54" width="1660" height="150" rx="34" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="112" y="124" class="title">Alur WMS sesuai new_budimas</text>
  <text x="114" y="165" class="subtitle">Receiving, QR Palet, Rak Titipan, Transfer Rak, Rak Tetap, Picking, Shipping + monitoring web dan mobile Android</text>
  <rect x="1364" y="91" width="305" height="76" rx="18" fill="#FFFFFF" opacity="0.18"/>
  <text x="1392" y="121" class="whiteSmall">API Production</text>
  <text x="1392" y="153" class="whiteBold">58.147.185.142:9092/api</text>

  <rect x="88" y="244" width="1130" height="470" class="panel"/>
  <text x="128" y="300" class="section">Flow Fisik Barang di Gudang</text>
  <text x="128" y="332" class="body">Ini mengikuti step visual di WmsRack3DPage.vue: barang masuk sampai dikirim.</text>

  <rect x="128" y="382" width="142" height="116" rx="18" fill="#EFF6FF" stroke="#B7D4FF" stroke-width="2" filter="url(#soft)"/>
  <circle cx="154" cy="412" r="18" fill="#0B5ED7"/><text x="148" y="419" class="numText">1</text>
  <text x="178" y="416" class="label">Receiving</text>
  <text x="150" y="454" class="body">Barang</text>
  <text x="150" y="478" class="body">masuk</text>

