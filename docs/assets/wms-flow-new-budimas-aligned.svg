  <text x="914" y="416" class="label">Rak Tetap</text>
  <text x="886" y="454" class="body">Ready</text>
  <text x="886" y="478" class="body">picking</text>

  <rect x="312" y="558" width="142" height="116" rx="18" fill="#FFF1F2" stroke="#FECDD3" stroke-width="2" filter="url(#soft)"/>
  <circle cx="338" cy="588" r="18" fill="#E11D48"/><text x="332" y="595" class="numText">6</text>
  <text x="362" y="592" class="label">Picking</text>
  <text x="334" y="630" class="body">Ambil</text>
  <text x="334" y="654" class="body">barang</text>

  <rect x="496" y="558" width="142" height="116" rx="18" fill="#EFF6FF" stroke="#B7D4FF" stroke-width="2" filter="url(#soft)"/>
  <circle cx="522" cy="588" r="18" fill="#0B5ED7"/><text x="516" y="595" class="numText">7</text>
  <text x="546" y="592" class="label">Loading</text>
  <text x="518" y="630" class="body">Manifest</text>
  <text x="518" y="654" class="body">kendaraan</text>

  <rect x="680" y="558" width="142" height="116" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#soft)"/>
